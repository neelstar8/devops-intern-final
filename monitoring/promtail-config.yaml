# Promtail discovers running Docker containers via the Docker socket and
# ships their stdout/stderr to Loki.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Every stream from this scrape config shares job="docker".
      - target_label: job
        replacement: docker

      # Docker reports names as "/nginx-app"; strip the leading slash.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

      # Set by `docker run --label service=nginx-app`.
      - source_labels: ["__meta_docker_container_label_service"]
        target_label: service

      # Present only when the container was started by Nomad.
      - source_labels: ["__meta_docker_container_label_com_hashicorp_nomad_alloc_id"]
        target_label: nomad_alloc_id
