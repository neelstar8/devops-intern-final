# Local logging stack for Task 6: Promtail -> Loki -> Grafana.
# The NGINX app itself runs separately (docker run or Nomad); Promtail
# discovers it through the Docker socket.

services:
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read-only access to the Docker socket for container discovery.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Local-only convenience so the reviewer can open Explore without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - loki
