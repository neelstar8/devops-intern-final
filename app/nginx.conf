# NGINX runs as the unprivileged "nginx" user (set via USER in the Dockerfile),
# so the PID file and every temp path must live somewhere that user can write.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths for the non-root user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access logs make it easy to filter by status code in LogQL,
    # e.g. `| json | status != 200` for Task 6.
    log_format json_access escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"user_agent":"$http_user_agent"'
    '}';

    # Logs go to stdout/stderr so Docker (and therefore Promtail) collects them.
    access_log /dev/stdout json_access;
    error_log  /dev/stderr warn;

    sendfile          on;
    keepalive_timeout 65;

    server {
        listen      8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Health endpoint used by the Docker HEALTHCHECK,
        # scripts/healthcheck.sh, and the Consul check in the Nomad job.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
